<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenBlueprint</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;background:#f6f7f9;color:#17202a}
    textarea{width:100%;min-height:140px;padding:12px;box-sizing:border-box;font:inherit}
    button{padding:10px 16px;margin-top:10px;cursor:pointer}
    pre{background:#111827;color:#e5e7eb;padding:16px;overflow:auto;border-radius:8px}
    .card{background:white;padding:20px;border-radius:10px;margin-bottom:20px}
  </style>
</head>
<body>
  <h1>OpenBlueprint</h1>
  <p>Local-first AI engineering design workspace.</p>
  <div class="card">
    <label for="prompt"><strong>Requirement</strong></label>
    <textarea id="prompt" placeholder="Example: Design a temperature monitoring system using a microcontroller, temperature sensor, local display, and 5V power supply."></textarea>
    <button id="run">Generate Proposal</button>
  </div>
  <div class="card"><strong>Result</strong><pre id="output">Waiting...</pre></div>
  <script>
    document.getElementById('run').onclick = async () => {
      const output = document.getElementById('output');
      output.textContent = 'Generating locally...';
      try {
        const r = await fetch('/api/v1/design/propose', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({prompt:document.getElementById('prompt').value})
        });
        const data = await r.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (e) { output.textContent = String(e); }
    };
  </script>
</body>
</html>
